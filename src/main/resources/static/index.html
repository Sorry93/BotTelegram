<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Doña Rosa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #0066a1;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #0066a1;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #004d7a;
        }
        .actions {
            display: flex;
            gap: 5px;
        }
    </style>
</head>
<body>
    <h1>Tienda Doña Rosa - Gestión de Inventario</h1>
    
    <div id="productForm">
        <h2>Añadir/Editar Producto</h2>
        <form id="form">
            <input type="hidden" id="codigo" name="codigo">
            <div class="form-group">
                <label for="nombre">Nombre del Producto:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="precio">Precio:</label>
                <input type="number" id="precio" name="precio" required>
            </div>
            <div class="form-group">
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" required>
            </div>
            <button type="submit">Guardar Producto</button>
            <button type="button" id="cancelBtn" style="display:none">Cancelar</button>
        </form>
    </div>
    
    <h2>Lista de Productos</h2>
    <table id="productTable">
        <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="productTableBody">
            <!-- Los productos se cargarán aquí dinámicamente -->
        </tbody>
    </table>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            
            const form = document.getElementById('form');
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                saveProduct();
            });
            
            document.getElementById('cancelBtn').addEventListener('click', function() {
                resetForm();
            });
        });
        
        function loadProducts() {
            fetch('/api/productos')
                .then(response => response.json())
                .then(products => {
                    const tableBody = document.getElementById('productTableBody');
                    tableBody.innerHTML = '';
                    
                    products.forEach(product => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${product.codigo}</td>
                            <td>${product.nombre}</td>
                            <td>${product.precio}</td>
                            <td>${product.cantidad}</td>
                            <td class="actions">
                                <button onclick="editProduct(${product.codigo})">Editar</button>
                                <button onclick="deleteProduct(${product.codigo})">Eliminar</button>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error al cargar productos:', error));
        }
        
        function saveProduct() {
            const codigo = document.getElementById('codigo').value;
            const producto = {
                nombre: document.getElementById('nombre').value,
                precio: parseInt(document.getElementById('precio').value),
                cantidad: parseInt(document.getElementById('cantidad').value)
            };
            
            const url = codigo ? `/api/productos/${codigo}` : '/api/productos';
            const method = codigo ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(producto)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al guardar el producto');
                }
                resetForm();
                loadProducts();
            })
            .catch(error => console.error('Error:', error));
        }
        
        function editProduct(codigo) {
            fetch(`/api/productos/${codigo}`)
                .then(response => response.json())
                .then(product => {
                    document.getElementById('codigo').value = product.codigo;
                    document.getElementById('nombre').value = product.nombre;
                    document.getElementById('precio').value = product.precio;
                    document.getElementById('cantidad').value = product.cantidad;
                    document.getElementById('cancelBtn').style.display = 'inline-block';
                })
                .catch(error => console.error('Error al cargar el producto:', error));
        }
        
        function deleteProduct(codigo) {
            if (confirm('¿Está seguro de eliminar este producto?')) {
                fetch(`/api/productos/${codigo}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error al eliminar el producto');
                    }
                    loadProducts();
                })
                .catch(error => console.error('Error:', error));
            }
        }
        
        function resetForm() {
            document.getElementById('form').reset();
            document.getElementById('codigo').value = '';
            document.getElementById('cancelBtn').style.display = 'none';
        }
    </script>
</body>
</html>
